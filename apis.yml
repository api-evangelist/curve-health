aid: curve-health
name: Curve Health
description: >-
  Curve Health is a New York City-based digital health technology company, founded in 2020,
  that delivers a virtual care and telemedicine platform purpose-built for skilled nursing
  facilities (SNFs) and senior care. The platform unifies telemedicine, a health information
  exchange, predictive analytics, and smart billing into a single system so nurses, physicians,
  behavioral health providers, and facility operators can deliver care in place and reduce
  avoidable hospital transfers. Curve Health reports enabling 150,000+ remote care visits and an
  80% reduction in hospitalizations for partner facilities, and is backed by Lightspeed Venture
  Partners and Morningside. This API Evangelist profile tracks the company's public web and
  product-documentation surface; Curve Health does not currently publish a public developer API,
  developer portal, or OpenAPI definition.
